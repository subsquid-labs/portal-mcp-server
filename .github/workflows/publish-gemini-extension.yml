name: Publish Gemini Extension

# Called by github-release.yml after it creates the release (a release
# created with GITHUB_TOKEN does not fire release:published), and still
# available for a manually created release or a repair.
on:
  workflow_call:
    inputs:
      tag:
        description: Release tag to package, for example v0.8.5
        required: true
        type: string
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing GitHub release tag to repair, for example v0.8.1
        required: true
        type: string

permissions: {}

concurrency:
  group: gemini-extension-${{ inputs.tag || github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out release
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.tag || github.event.release.tag_name }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Validate and package Gemini extension
        env:
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          npm run test:gemini-extension
          VERSION="${RELEASE_TAG#v}"
          PACKAGE_VERSION="$(node -p 'require("./package.json").version')"
          if [[ "$RELEASE_TAG" != "v$PACKAGE_VERSION" || "$VERSION" != "$PACKAGE_VERSION" ]]; then
            echo "Release tag $RELEASE_TAG does not match package version $PACKAGE_VERSION" >&2
            exit 1
          fi
          npm run package:gemini

      - name: Require Gemini discovery topic
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/${GITHUB_REPOSITORY}/topics" \
            --jq '.names | index("gemini-cli-extension")' \
            | grep -qv '^null$'

      - name: Upload Gemini archives
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: gh release upload "$RELEASE_TAG" dist/gemini/*sqd.tar.gz --clobber

      - name: Verify release asset
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          for name in sqd.tar.gz darwin.sqd.tar.gz linux.sqd.tar.gz win32.sqd.tar.gz; do
            gh release view "$RELEASE_TAG" --json assets \
              --jq ".assets[] | select(.name == \"$name\") | .url" \
              | grep -q '^https://'
          done
